name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'public/waaheen-release.apk'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Copy APK to public folder
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk public/waaheen-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: waaheen-market-apk
          path: public/waaheen-release.apk

      - name: Commit and Push compiled APK
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/waaheen-release.apk
          git diff --staged --quiet || (git commit -m "chore(release): update compiled Android APK [skip ci]" && git push)
