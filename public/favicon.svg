<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101C" />
      <stop offset="50%" stop-color="#0D1B2A" />
      <stop offset="100%" stop-color="#1B3350" />
    </linearGradient>

    <!-- Golden Bag Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Handle Gradient -->
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Glow Effect -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.38" />
    </filter>

    <!-- Subtle Shadow under Bag -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Squircle Background -->
  <rect width="512" height="512" rx="118" fill="url(#bgGrad)" />
  
  <!-- Subtle Outer Border Stroke -->
  <rect width="506" height="506" x="3" y="3" rx="115" fill="none" stroke="#F59E0B" stroke-opacity="0.2" stroke-width="6" />

  <!-- Shopping Bag Handle -->
  <path d="M 196 175 C 196 100, 316 100, 316 175" 
        fill="none" 
        stroke="url(#handleGrad)" 
        stroke-width="26" 
        stroke-linecap="round" />

  <!-- Shopping Bag Body with Golden Glow -->
  <g filter="url(#goldGlow)">
    <path d="M 135 170 
             L 377 170 
             C 388 170, 396 178, 394 189 
             L 370 388 
             C 368 406, 353 420, 335 420 
             L 177 420 
             C 159 420, 144 406, 142 388 
             L 118 189 
             C 116 178, 124 170, 135 170 Z" 
          fill="url(#goldGrad)" />
  </g>

  <!-- Stylized "W" Brand Cutout inside Shopping Bag -->
  <path d="M 188 225 
           L 218 355 
           L 242 355 
           L 256 288 
           L 270 355 
           L 294 355 
           L 324 225 
           L 298 225 
           L 282 312 
           L 268 245 
           L 244 245 
           L 230 312 
           L 214 225 Z" 
        fill="#0D1B2A" 
        filter="url(#softShadow)" />

  <!-- Sparkle / Star on top right of the bag -->
  <g transform="translate(372, 140)">
    <!-- 4-point star -->
    <path d="M 0 -24 Q 0 0, 24 0 Q 0 0, 0 24 Q 0 0, -24 0 Q 0 0, 0 -24 Z" fill="#FFFBEB" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
  </g>

  <!-- Small accent spark -->
  <g transform="translate(136, 390)">
    <circle cx="0" cy="0" r="4.5" fill="#FEF08A" opacity="0.8" />
  </g>
</svg>